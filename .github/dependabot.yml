version: 2
updates:
  # Next.js / TypeScript application dependencies.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # Casper/Odra smart contract dependencies.
  - package-ecosystem: "cargo"
    directory: "/contracts/build-dossier-registry"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # GitHub Actions versions.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
