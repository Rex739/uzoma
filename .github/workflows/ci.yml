name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  app:
    name: Next.js app checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Type check
        run: npm run typecheck --if-present

      - name: Test
        run: npm test --if-present

      - name: Build
        run: npm run build --if-present

  contracts:
    name: Casper/Odra contract checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect Cargo contract directory
        id: detect-contract
        shell: bash
        run: |
          set -euo pipefail

          for dir in \
            contracts/build-dossier-registry \
            contracts \
            odra \
            casper \
            contract
          do
            if [ -f "$dir/Cargo.toml" ]; then
              echo "contract_dir=$dir" >> "$GITHUB_OUTPUT"
              echo "found=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done

          echo "found=false" >> "$GITHUB_OUTPUT"

      - name: Setup Rust
        if: steps.detect-contract.outputs.found == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        if: steps.detect-contract.outputs.found == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ steps.detect-contract.outputs.contract_dir }}

      - name: Cargo check
        if: steps.detect-contract.outputs.found == 'true'
        working-directory: ${{ steps.detect-contract.outputs.contract_dir }}
        run: cargo check --locked

      - name: Cargo test
        if: steps.detect-contract.outputs.found == 'true'
        working-directory: ${{ steps.detect-contract.outputs.contract_dir }}
        shell: bash
        run: |
          set -euo pipefail
          if find tests src -type f -name '*.rs' | grep -q .; then
            cargo test --locked
          else
            echo "No Rust tests detected; skipping cargo test."
          fi

      - name: Cargo build
        if: steps.detect-contract.outputs.found == 'true'
        working-directory: ${{ steps.detect-contract.outputs.contract_dir }}
        run: cargo build --locked

      - name: Skip contract checks
        if: steps.detect-contract.outputs.found != 'true'
        run: echo "No Cargo.toml found in known Casper/Odra contract directories; skipping contract checks."
